# Tests Claude Duo on Windows and builds "Claude-Duo-Windows.exe". A tag like v2.1.0 also publishes it as a release.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build the .exe
        run: |
          python -c "from PIL import Image; Image.open('iphone/icon-512.png').save('claude-duo.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          pyinstaller --noconfirm --onefile --windowed --name "Claude Duo" --icon claude-duo.ico `
            --add-data "index.html;." --add-data "compact.html;." --add-data "settings.html;." --add-data "sessions.html;." `
            --add-data "glass.css;." --add-data "ui.js;." --add-data "iphone;iphone" `
            --hidden-import phone --hidden-import statusline winapp.py
          Copy-Item "dist\Claude Duo.exe" "dist\Claude-Duo-Windows.exe"

      - name: Self-test the .exe (server, pages, APIs, iPhone app, icon)
        run: |
          $p = Start-Process -FilePath "dist\Claude Duo.exe" -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Window test (real WebView2 windows and tray icon)
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "dist\Claude Duo.exe" -ArgumentList "--guitest", "$PWD\guitest.txt" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); "FAILED: timed out" | Out-File guitest.txt -Append }
          Get-Content guitest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Duo-Windows
          path: |
            dist/Claude-Duo-Windows.exe
            selftest.txt
            guitest.txt
            tray-icon-preview.png

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "dist\Claude-Duo-Windows.exe" --title "Claude Duo $env:GITHUB_REF_NAME for Windows" --prerelease --notes "Download **Claude-Duo-Windows.exe** and run it. Your Claude plan % appears in the system tray (by the clock; if it's hidden, drag it out of the ^ overflow). Windows may warn about an unknown publisher the first time: choose More info, then Run anyway. See the README for details."
